<div class="report-fit-fragment"><!-- SHARED_TABLE_FIT_START --><style>/* Every report table, including dynamically loaded fragments and scenario views. */
html body table.report-fit-table{display:table!important;table-layout:fixed!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow:visible!important;white-space:normal!important;border-collapse:collapse;box-sizing:border-box}
html body table.report-fit-table :is(th,td){min-width:0!important;max-width:none!important;width:auto;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;box-sizing:border-box;vertical-align:top;padding:.45rem!important}
html body table.report-fit-table th,html body table.report-fit-table th span{writing-mode:horizontal-tb!important;transform:none!important;white-space:normal!important;height:auto!important;text-align:left!important}
html body table.report-fit-table :is(td,th) *{max-width:100%;min-width:0;white-space:normal!important;overflow-wrap:anywhere}
html body table.report-fit-table :is(img,svg,input,select,button){max-width:100%!important;box-sizing:border-box}
html body table.report-fit-table.fit-stacked,html body table.report-fit-table.fit-stacked :is(tbody,tfoot){display:block!important;width:100%!important}
html body table.report-fit-table.fit-stacked thead{position:absolute!important;width:1px!important;height:1px!important;clip-path:inset(50%);overflow:hidden!important}
html body table.report-fit-table.fit-stacked :is(tbody,tfoot)>tr{display:block!important;width:100%!important;margin:.65rem 0!important;border:1px solid #c6d8de;border-radius:5px;background:#fff}
html body table.report-fit-table.fit-stacked :is(tbody,tfoot)>tr>:is(td,th){display:grid!important;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:.55rem;width:100%!important;height:auto!important;text-align:left!important;position:static!important;transform:none!important}
html body table.report-fit-table.fit-stacked :is(tbody,tfoot)>tr>:is(td,th)::before{content:attr(data-label);font-weight:600;color:#24536a;overflow-wrap:anywhere;white-space:normal}
html body .report-fit-wrapper{min-width:0!important;max-width:100%!important;width:100%!important;overflow:visible!important;max-height:none!important}
html body table.report-fit-table[hidden],html body table.report-fit-table.fit-stacked [hidden]{display:none!important}
</style><script>/* Table layout is shared by all pages; observers cover future branch/fragment loads. */
(()=>{
  if(window.reportTableFit)return;
  let pending=false;
  function labels(table){
    const grid=[];
    for(const [r,row] of [...(table.tHead?.rows||[])].entries()){
      grid[r] ||= [];let col=0;
      for(const cell of row.cells){
        while(grid[r][col])col++;
        for(let y=r;y<r+cell.rowSpan;y++){
          grid[y] ||= [];
          for(let x=col;x<col+cell.colSpan;x++)grid[y][x]=cell.textContent.trim();
        }
        col+=cell.colSpan;
      }
    }
    return Array.from({length:Math.max(0,...grid.map(r=>r.length))},(_,i)=>[...new Set(grid.map(r=>r[i]).filter(Boolean))].join(' / '));
  }
  function fit(){
    pending=false;
    for(const table of document.querySelectorAll('table')){
      if(!table.getClientRects().length)continue;
      if(!table.classList.contains('report-fit-table'))table.classList.add('report-fit-table');
      const headings=labels(table);
      for(const section of [...table.tBodies,...(table.tFoot?[table.tFoot]:[])]){
        for(const row of section.rows){let col=0;
          for(const cell of row.cells){
            const label=headings.slice(col,col+cell.colSpan).join(' / ')||cell.dataset.label||`Column ${col+1}`;
            if(cell.dataset.label!==label)cell.dataset.label=label;
            col+=cell.colSpan;
          }
        }
      }
      for(let parent=table.parentElement;parent&&parent!==document.body;parent=parent.parentElement){
        const style=getComputedStyle(parent);
        if(['auto','scroll'].includes(style.overflowX)||/table-scroll|performance-table-scroll|fund-case-wrap/.test(parent.className))parent.classList.add('report-fit-wrapper');
      }
      const width=table.parentElement?.getBoundingClientRect().width||innerWidth;
      const cols=Math.max(headings.length,...[...table.rows].map(r=>[...r.cells].reduce((s,c)=>s+c.colSpan,0)));
      table.classList.toggle('fit-stacked',width<700||cols*105>width);
    }
    document.documentElement.dataset.tablesReady='true';
  }
  function schedule(){if(window.reportTableFitPaused)return;if(!pending){pending=true;requestAnimationFrame(fit)}}
  window.reportTableFit=fit;
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','open']});
  addEventListener('resize',schedule);document.addEventListener('toggle',schedule,true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
})();
</script><!-- SHARED_TABLE_FIT_END --><details><summary><strong>Figure 3.a. All 70 eligible assets — Pearson / Spearman with Ward clustering</strong></summary><a href="figures/long_history/correlation_all_pearson.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_all_pearson.png?v=1f129e624c8d" alt="All 70 eligible assets" style="width:100%;height:auto"></a><a href="figures/long_history/correlation_all_spearman.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_all_spearman.png?v=086fed86273e" alt="All 70 eligible assets" style="width:100%;height:auto"></a></details><details><summary><strong>Figure 3.a. Assets held in at least one updated portfolio — Pearson / Spearman with Ward clustering</strong></summary><a href="figures/long_history/correlation_selected_pearson.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_selected_pearson.png?v=2403a6076723" alt="Assets held in at least one updated portfolio" style="width:100%;height:auto"></a><a href="figures/long_history/correlation_selected_spearman.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_selected_spearman.png?v=8c03519334cd" alt="Assets held in at least one updated portfolio" style="width:100%;height:auto"></a></details><details><summary><strong>Figure 3.a. Current holdings — Pearson / Spearman with Ward clustering</strong></summary><a href="figures/long_history/correlation_current_pearson.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_current_pearson.png?v=7efca9953498" alt="Current holdings" style="width:100%;height:auto"></a><a href="figures/long_history/correlation_current_spearman.png" target="_blank" rel="noopener"><img loading="lazy" src="figures/long_history/correlation_current_spearman.png?v=6a8af6dc9e78" alt="Current holdings" style="width:100%;height:auto"></a></details></div>
