name: Publish report
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm Pages artifact and use REST metadata lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['GITHUB_RUN_ID']
          expected = os.environ['PAGES_ARTIFACT_NAME']
          headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'}
          for attempt in range(30):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == expected and not a['expired'] and a['size_in_bytes'] > 0]
              if len(matches) == 1:
                  print('Confirmed current-run artifact:', expected)
                  break
              time.sleep(4)
          else:
              raise RuntimeError('Uploaded Pages artifact not available through REST metadata')
          # The bundled official client supports findBy, which uses REST rather
          # than the internal listing that repeatedly returned an empty list.
          bundle = Path(os.environ['RUNNER_WORKSPACE']).parent / '_actions/actions/deploy-pages/v4/dist/index.js'
          source = bundle.read_text()
          old = 'await artifactClient.listArtifacts()'
          new = "await artifactClient.listArtifacts({findBy: {token: process.env.GITHUB_TOKEN, workflowRunId: Number(process.env.GITHUB_RUN_ID), repositoryOwner: process.env.GITHUB_REPOSITORY.split('/')[0], repositoryName: process.env.GITHUB_REPOSITORY.split('/')[1]}})"
          assert source.count(old) == 1, 'Upstream action changed; do not patch an unknown bundle'
          bundle.write_text(source.replace(old, new, 1))
          PY
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
